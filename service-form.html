<!--
  ============================================================
  PRECISION VEHICLE WRAPS: QUOTE FORM FOR EVERY PAGE
  ============================================================
  One snippet for the contact page and every service page. Paste this
  whole file into an Elementor "HTML" widget (the Shortcode widget the
  contact page uses today works too).

  WHICH FORM SHOWS
    Set data-service on the <div class="pvw-qf"> below:
      ppf | colour-change | window-tinting | detailing | fleet | decals |
      windshield | graphic-design | special-projects | general
    Leave it as "auto" and the form reads the page address instead
    (/paint-protection-film/ = ppf, /colour-change/ = colour-change,
    /window-tinting/ = window-tinting, /ceramic-coating/ or /detailing/ =
    detailing, /commercial-fleet-wraps/ = fleet, /decals/ = decals, ...).
    Any other page gets the general form with the full service list.

  STEPS (Alex, 2026-10-15)
    Every form is 2 or 3 short steps with Back / Next: About you (first
    name, phone, email), Your vehicle (make, model, trim), then the one
    question the page asks ("Do you have a PPF package in mind?" and so
    on) plus optional details, consent and Send. Fleet adds company name,
    number of vehicles, a box for more vehicles, and the artwork and
    design questions. Decals asks what they need and sends.

  OPTIONAL SETTINGS (same <div>)
    data-theme="dark"    solid dark card, for white sections (default)
    data-theme="glass"   see-through card, for dark sections (contact page)
    data-theme="light"   white card with navy text
    data-heading="..."   replace the heading; "off" hides the heading block
    data-sub="..."       replace the line under the heading
    data-thanks="off"    stay on the page after sending

  LINK A BUTTON TO THE FORM
    The first form on a page gets id="quote", so a button link of
    #quote scrolls to it.

  DO NOT CHANGE
    - 'Fleet Wrap (Multiple Vehicles)'. The GHL workflow tests that exact
      text to send fleet leads the commercial email and rep. Every other
      service value is free text in GHL (opportunity name, "Service
      Interested" field, the lead note), so a new one needs no GHL change.
      Labels visitors see can differ from the values.
    - source: 'Precision Vehicle Wraps Web Form' (the opportunity source).
    - "Any HTTP reply is success" on the webhook call (GHL answers 422
      even when it saved the lead).

  AFTER A SEND
    1. dataLayer event "generate_lead" (service_type, form_variant).
    2. The visitor lands on the thank-you page Google Ads counts:
         PPF                  /thank-you-ppf-quote/  (uses /thank-you/ if missing)
         Detailing & Ceramic  /ceramic-thank-you/
         Others               /thank-you/
  ============================================================
-->

<script>
(function () {
  'use strict';
  if (window.PVWQuoteForm) { window.PVWQuoteForm.init(); return; }

  var GHL_WEBHOOK_URL = 'https://services.leadconnectorhq.com/hooks/hrVgZySsdb9y1vpJfUw7/webhook-trigger/USkvJQNA7osuZzOhja9b';
  var SOURCE          = 'Precision Vehicle Wraps Web Form';
  var MIN_SUBMIT_MS   = 1500;
  var PHONE           = '780-447-1031';

  // The service_type values GHL receives. The workflow "General Form
  // (coded+hosted)" copies them as free text into the opp name, the contact's
  // Service Interested field and the note. Only 'Fleet Wrap (Multiple
  // Vehicles)' is tested by value (three If/Else checks route it to the
  // commercial email and rep), so never rename that one without changing those
  // checks first. What visitors read can differ: each choice below is [value, label].
  var SERVICES = [
    'Full Vehicle Wrap',
    'Partial Wrap',
    'Paint Protection Film (PPF)',
    'Ceramic Coating',
    'Windshield Protection',
    'Fleet Wrap (Multiple Vehicles)',
    'Decals / Lettering',
    'Color Change Wrap',
    'Other / Not Sure Yet'
  ];

  var KNOW = 'Yes, I know exactly what I want';
  var YES_NO = ['Yes', 'No'];
  var VEHICLE_COUNTS = ['1-2', '3-5', '6-50'];

  // Field kinds: text | email | tel | select | chips | textarea.
  //   required  blocks Next/Send until filled (email and phone are also checked).
  //   full      spans both grid columns.
  //   payload   extra key sent to GHL (unmapped keys are ignored there until someone maps them).
  //   note      line added to `message`, which lands in the GHL lead note, so
  //             every answer reaches the shop even before a key is mapped.
  //   question  also sends `<payload>_question` with the label.
  function contact() {
    return [
      { name: 'firstName', label: 'First Name', kind: 'text', auto: 'given-name', ph: 'Alex', required: true },
      { name: 'phone', label: 'Phone Number', kind: 'tel', auto: 'tel', ph: '(780) 555-0100', required: true, err: 'Please enter a valid phone number.' },
      { name: 'email', label: 'Email Address', kind: 'email', auto: 'email', ph: 'you@email.com', required: true, full: true, err: 'Please enter a valid email address.' }
    ];
  }
  function vehicle(required) {
    return [
      { name: 'vehicleMake', label: 'Vehicle Make', kind: 'text', ph: 'e.g. Ford, BMW, Ram', required: required },
      { name: 'vehicleModel', label: 'Vehicle Model', kind: 'text', ph: 'e.g. F-150, M4, Transit', required: required },
      { name: 'vehicleTrim', label: 'Trim', kind: 'text', ph: 'e.g. Lariat, M Sport, Laramie', required: false, full: true, payload: 'vehicle_trim', note: 'Trim' }
    ];
  }
  function mind(question, other) {
    return { name: 'inMind', label: question, kind: 'chips', options: [KNOW, other], required: true, full: true, payload: 'in_mind', note: question, question: true };
  }
  function details(ph, label, help) {
    return { name: 'message', label: label || 'Details & Questions', kind: 'textarea', ph: ph, required: false, full: true, help: help };
  }
  function serviceChoice(label, choices) {
    return { name: 'serviceType', label: label, kind: choices.length > 5 ? 'select' : 'chips', options: choices, required: true, full: true, service: true };
  }
  function step(title, fields) { return { title: title, fields: fields }; }

  var VARIANTS = {
    ppf: {
      eyebrow: 'Paint Protection Film',
      heading: 'Get Your Free PPF Quote',
      sub: 'Three quick steps. We reply within 1 business day.',

  function readCookie(name) {
    var parts = document.cookie ? document.cookie.split('; ') : [];
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (parts[i].slice(0, eq) === name) {
        try { return decodeURIComponent(parts[i].slice(eq + 1)); } catch (e) { return parts[i].slice(eq + 1); }
      }
    }
    return '';
  }

  // Where the lead came from. URL parameters first, then the HandL UTM
  // Grabber cookies the site already sets. GHL ignores keys the workflow
  // does not map, so these are safe to send before anyone maps them.
  function attribution() {
    var q = {};
    try { new URLSearchParams(window.location.search).forEach(function (val, k) { q[k] = val; }); } catch (e) {}
    var a = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid'].forEach(function (k) {
      a[k] = q[k] || readCookie(k) || '';
    });
    if (!a.gclid) {
      var gcl = readCookie('_gcl_aw');
      if (gcl) a.gclid = gcl.split('.').slice(2).join('.');
    }
    a.landing_page = readCookie('handl_landing_page');
    a.original_referrer = readCookie('handl_original_ref');
    a.referrer = readCookie('handl_ref') || document.referrer || '';
    var summary = [];
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(function (k) {
      if (a[k]) summary.push(k.replace('utm_', '') + '=' + a[k]);
    });
    if (a.gclid) summary.push('gclid');
    if (a.fbclid) summary.push('fbclid');
    if (a.landing_page) summary.push('landing=' + a.landing_page);
    if (a.original_referrer) summary.push('ref=' + a.original_referrer);
    a.utm_summary = summary.join(' | ').slice(0, 500);
    return a;
  }

  function bind(root, key, v, n) {
    var form = root.querySelector('.qf-form');
    var card = root.querySelector('.qf-card');

    var btnText = root.querySelector('.qf-btn-text');

    var fail = root.querySelector('.qf-fail');
    var steps = root.querySelectorAll('.qf-step');
    var bars = root.querySelectorAll('.qf-bar');
    var count = root.querySelector('.qf-step-count');
    var title = root.querySelector('.qf-step-title');
    var total = v.steps.length;
    var current = 0;
    var loadedAt = Date.now();
    var sending = false;
    var prefix = 'pvwqf' + n + '-';
    var el = function (f) { return document.getElementById(prefix + f); };
    var val = function (f) { var e = el(f); return e ? e.value.trim() : ''; };
    var picked = function (f) {
      var r = root.querySelector('input[name="' + prefix + f + '-r"]:checked');
      return r ? r.value : '';
    };
    var value = function (f) { return f.kind === 'chips' ? picked(f.name) : val(f.name); };
    var focusable = function (f) {
      return f.kind === 'chips' ? root.querySelector('input[name="' + prefix + f.name + '-r"]') : el(f.name);
    };

    function mark(f, bad, target) {
      var t = target || el(f);
      var e = el(f + '-err');
      if (t) {
        t.classList[bad ? 'add' : 'remove']('is-invalid');
        if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') {
          if (bad) { t.setAttribute('aria-invalid', 'true'); if (e) t.setAttribute('aria-describedby', e.id); }
          else { t.removeAttribute('aria-invalid'); }

      }

      return bad;
    }

    function serviceValue() {
      if (v.service) return v.service;
      var found = '';
      eachField(v, function (f) { if (f.service) found = value(f); });
      return found;
    }

    function phoneOk(p) {
      var d = (p || '').replace(/\D/g, '');
      if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
      return d.length >= 10 && d.length <= 15;
    }

    function fieldBad(f) {
      var x = value(f);
      if (!x) return !!f.required;
      if (f.kind === 'email') return !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x);
      if (f.kind === 'tel') return !phoneOk(x);
      return false;
    }

    // Marks every problem on step s; returns the element to focus, or null.
    function validateStep(s) {
      var first = null;
      var fields = v.steps[s].fields;
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];
        if (mark(f.name, fieldBad(f), el(f.name)) && !first) first = focusable(f);
      }
      if (s === total - 1) {
        var txn = el('consentTxn');
        mark('consentTxn', !txn.checked, el('consentRow'));
        if (!txn.checked && !first) first = txn;
      }
      return first;
    }

      if (!t) return;
      try { t.focus({ preventScroll: false }); } catch (x) { t.focus(); }

      title.textContent = v.steps[s].title;

    function message() {

        if (!f.note) return;

        // other notes read "Trim: Lariat".
        if (x) lines.push(f.note + (/\?$/.test(f.note) ? ' ' : ': ') + x);

      if (!lines.length) return typed;
      return lines.join('\n') + (typed ? '\n\n' + typed : '');
    }

      var target = setting !== 'auto' ? setting : (THANK_YOU[serviceType] || THANK_YOU_DEFAULT);
      var nav = window.PVWQF_NAVIGATE || function (url) { window.location.href = url; };
      var go = function (url) { setTimeout(function () { nav(url); }, 900); };
      if (target === THANK_YOU_DEFAULT) { go(target); return; }
      // A missing page redirects to the homepage here, which counts nothing,
      // so check the page exists first and fall back to /thank-you/.
      var settled = false;
      var settle = function (url) { if (!settled) { settled = true; go(url); } };
      setTimeout(function () { settle(THANK_YOU_DEFAULT); }, 2500);

        .then(function (res) { settle(res.ok && !res.redirected ? target : THANK_YOU_DEFAULT); })
        .catch(function () { settle(THANK_YOU_DEFAULT); });
    }

    back.addEventListener('click', function () { if (current > 0 && !sending) show(current - 1); });

    form.addEventListener('input', function (e) {
      var t = e.target;
      if (t.classList && t.classList.contains('is-invalid')) mark(t.id.replace(prefix, ''), false);
    });
    form.addEventListener('change', function (e) {
      var t = e.target;
      if (t.type === 'radio') {
        var f = t.name.replace(prefix, '').replace(/-r$/, '');
        mark(f, false, el(f));
      }
      if (t.type === 'checkbox' && t.checked && t.name === 'sms_consent_transactional') mark('consentTxn', false, el('consentRow'));
      if (t.tagName === 'SELECT' && t.value) mark(t.id.replace(prefix, ''), false);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;
      fail.classList.remove('is-shown');

      // Enter or Next on an earlier step: check that step, then move on.
      if (current < total - 1) {
        var bad = validateStep(current);
        if (bad) { focusOn(bad); return; }
        show(current + 1);
        return;
      }

      // Bots: fake success, send nothing, count nothing.
      if (val('website') || Date.now() - loadedAt < MIN_SUBMIT_MS) { done(); return; }

      // Every step is checked again; the first problem wins and its step shows.
      for (var s = 0; s < total; s++) {
        var firstBad = validateStep(s);
        if (firstBad) { if (s !== current) show(s); focusOn(firstBad); return; }
      }

      sending = true;
      btn.disabled = true;
      back.disabled = true;
      btn.classList.add('is-loading');

      var serviceType = serviceValue();
      var a = attribution();
      var payload = {
        firstName:                 val('firstName'),
        lastName:                  '',
        email:                     val('email'),
        phone:                     val('phone'),
        vehicle_year:              '',
        vehicle_make:              val('vehicleMake'),
        vehicle_model:             val('vehicleModel'),
        vehicle_trim:              val('vehicleTrim'),
        service_type:              serviceType,
        message:                   message(),
        sms_consent_transactional: el('consentTxn').checked,
        sms_consent_marketing:     el('consentMkt').checked,
        consent_timestamp:         new Date().toISOString(),
        consent_user_agent:        (navigator && navigator.userAgent) ? navigator.userAgent : '',
        source:                    SOURCE,
        page_url:                  window.location.href,
        // Keys the GHL workflow ignores until someone maps them. Every answer
        // is also in `message`, which lands in the lead note.
        form_variant:              key,
        company_name:              '',
        vehicle_count:             '',
        utm_source:                a.utm_source,
        utm_medium:                a.utm_medium,
        utm_campaign:              a.utm_campaign,
        utm_term:                  a.utm_term,
        utm_content:               a.utm_content,
        gclid:                     a.gclid,
        fbclid:                    a.fbclid,
        landing_page:              a.landing_page,
        original_referrer:         a.original_referrer,
        referrer:                  a.referrer,
        utm_summary:               a.utm_summary
      };
      eachField(v, function (f) {
        if (!f.payload) return;
        payload[f.payload] = value(f);
        if (f.question) payload[f.payload + '_question'] = f.label;
      });

      fetch(GHL_WEBHOOK_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      })
      .then(function () {
        // GHL's inbound webhook replies 422 even when it ingests the payload,
        // so any HTTP response counts as success. Never throw on !res.ok here.
        // (Fixed in 42e176d, regressed in 70af4b4, re-fixed in 1f0263a.)
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: 'generate_lead', form_variant: key, service_type: serviceType });
        done();
        goThankYou(serviceType);
      })
      .catch(function (err) {
        if (window.console) console.error('PVW quote form: send failed', err);
        sending = false;
        btn.disabled = false;
        back.disabled = false;
        btn.classList.remove('is-loading');
        fail.classList.add('is-shown');
      });
    });
  }

  function init() {
    var roots = document.querySelectorAll('.pvw-qf');
    for (var i = 0; i < roots.length; i++) {
      var root = roots[i];
      if (root.getAttribute('data-ready')) continue;
      root.setAttribute('data-ready', '1');
      var key = pickVariant(root);
      var n = ++counter;
      render(root, key, VARIANTS[key], n);
      bind(root, key, VARIANTS[key], n);
      root.setAttribute('data-variant', key);
      var inPopup = root.closest('[data-elementor-type="popup"], .elementor-popup-modal');
      if (!root.id && !inPopup && !document.getElementById('quote')) root.id = 'quote';
    }
  }

  window.PVWQuoteForm = { init: init, version: '2026-10-16', variants: Object.keys(VARIANTS) };
  init();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  if (window.jQuery) window.jQuery(document).on('elementor/popup/show', init);
})();
</script>
