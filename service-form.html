<!--
  ============================================================
  PRECISION VEHICLE WRAPS: QUOTE FORM FOR EVERY PAGE
  ============================================================
  One snippet for the contact page and every service page. Paste this
  whole file into an Elementor "HTML" widget (the Shortcode widget the
  contact page uses today works too).

  WHICH FORM SHOWS
    Set data-service on the <div class="pvw-qf"> below:
      ppf | ceramic | windshield | fleet | decals | graphic-design |
      special-projects | window-tinting | general
    Leave it as "auto" and the form reads the page address instead
    (/paint-protection-film/ = ppf, /ceramic-coating/ = ceramic, ...).
    Any other page gets the general form with the full service list.

  OPTIONAL SETTINGS (same <div>)
    data-theme="dark"    solid dark card, for white sections (default)
    data-theme="glass"   see-through card, for dark sections (contact page)
    data-theme="light"   white card with navy text
    data-heading="..."   replace the heading; "off" hides the heading block
    data-sub="..."       replace the line under the heading
    data-thanks="off"    stay on the page after sending

  LINK A BUTTON TO THE FORM
    The first form on a page gets id="quote", so a button link of
    #quote scrolls to it.

  DO NOT CHANGE
    - 'Fleet Wrap (Multiple Vehicles)'. The GHL workflow tests that exact
      text to send fleet leads the commercial email and rep. Every other
      service value is free text in GHL (opportunity name, "Service
      Interested" field, the lead note), so a new one needs no GHL change.
      Labels visitors see can differ from the values.
    - source: 'Precision Vehicle Wraps Web Form' (the opportunity source).
    - "Any HTTP reply is success" on the webhook call (GHL answers 422
      even when it saved the lead).

  AFTER A SEND
    1. dataLayer event "generate_lead" (service_type, form_variant).
    2. The visitor lands on the thank-you page Google Ads counts:
         PPF      /thank-you-ppf-quote/  (uses /thank-you/ if missing)
         Ceramic  /ceramic-thank-you/
         Others   /thank-you/
  ============================================================
-->

  function pickVariant(root) {
    var v = (root.getAttribute('data-service') || '').trim().toLowerCase();
    if (ALIASES[v]) v = ALIASES[v];
    if (v && v !== 'auto' && VARIANTS[v]) return v;
    var path = (window.location.pathname || '/').toLowerCase();
    for (var i = 0; i < PATHS.length; i++) {
      if (path.indexOf(PATHS[i][0]) === 0) return PATHS[i][1];
    }
    return 'general';
  }

  function render(root, key, v, n) {
    var id = function (f) { return 'pvwqf' + n + '-' + f; };
    var heading = root.getAttribute('data-heading');
    var sub = root.getAttribute('data-sub');
    var hideHead = heading === 'off';
    if (!heading || hideHead) heading = v.heading;
    if (sub == null) sub = v.sub;

    function err(f, text) {
      return '<p class="qf-err" id="' + id(f) + '-err">' + esc(text) + '</p>';
    }
    function text(f, label, type, auto, ph, required, full, extra, errText) {
      return '<div class="' + (full ? 'qf-full' : '') + '">' +
        '<label class="qf-label" for="' + id(f) + '">' + esc(label) +
        (required ? '<span class="qf-req">*</span>' : '<span class="qf-opt">(optional)</span>') + '</label>' +
        '<input type="' + type + '" id="' + id(f) + '" name="' + f + '" placeholder="' + esc(ph) + '"' +
        (auto ? ' autocomplete="' + auto + '"' : '') + (extra || '') + '>' +
        (required ? err(f, errText || 'Please enter your ' + label.toLowerCase() + '.') : '') +
        '</div>';
    }
    function select(f, label, placeholder, options, required, full) {
      var h = '<div class="' + (full ? 'qf-full' : '') + '">' +
        '<label class="qf-label" for="' + id(f) + '">' + esc(label) +
        (required ? '<span class="qf-req">*</span>' : '<span class="qf-opt">(optional)</span>') + '</label>' +
        '<div class="qf-select"><select id="' + id(f) + '" name="' + f + '">' +
        '<option value="">' + esc(placeholder) + '</option>';
      for (var i = 0; i < options.length; i++) {
        var o = options[i];
        var value = typeof o === 'string' ? o : o[0];
        var shown = typeof o === 'string' ? o : o[1];
        h += '<option value="' + esc(value) + '">' + esc(shown) + '</option>';
      }
      return h + '</select></div>' + (required ? err(f, 'Please choose one.') : '') + '</div>';
    }

    var h = [];
    h.push('<div class="qf-card">');
    if (!hideHead) {
      h.push('<div class="qf-head">');
      if (v.eyebrow) h.push('<p class="qf-eyebrow">' + esc(v.eyebrow) + '</p>');
      h.push('<h3 class="qf-title">' + esc(heading) + '</h3>');
      if (sub) h.push('<p class="qf-sub">' + esc(sub) + '</p>');
      h.push('</div>');
    }
    h.push('<form class="qf-form" novalidate><div class="qf-grid">');

    h.push('<p class="qf-section">Your Contact Info</p>');
    h.push(text('firstName', 'First Name', 'text', 'given-name', 'Alex', true));
    h.push(text('lastName', 'Last Name', 'text', 'family-name', 'Smith', true));
    h.push(text('email', 'Email Address', 'email', 'email', 'you@email.com', true, false, '', 'Please enter a valid email address.'));
    h.push(text('phone', 'Phone Number', 'tel', 'tel', '(780) 555-0100', true, false, ' inputmode="tel"', 'Please enter a valid phone number.'));
    if (v.company) h.push(text('company', 'Company', 'text', 'organization', 'Your business name', false, true));

    h.push('<p class="qf-section">Vehicle Details</p>');
    if (v.vehicleCount) h.push(select('vehicleCount', 'Number of Vehicles', 'How many vehicles?', VEHICLE_COUNTS, false, true));
    var req = !v.vehicleOptional;
    h.push(text('vehicleYear', 'Vehicle Year', 'text', '', 'e.g. 2022', req, false, ' inputmode="numeric" maxlength="4"'));
    h.push(text('vehicleMake', 'Vehicle Make', 'text', '', 'e.g. Ford, BMW, Ram', req));
    h.push(text('vehicleModel', 'Vehicle Model', 'text', '', 'e.g. M4, Transit, F-150', req, true));

    if (v.choices && v.choices.length > 5) {
      h.push(select('serviceType', v.choiceLabel, 'Select a service', v.choices, true, true));
    } else if (v.choices) {
      h.push('<fieldset class="qf-full"><legend>' + esc(v.choiceLabel) + '<span class="qf-req">*</span></legend>' +
        '<div class="qf-chips" id="' + id('serviceType') + '">');
      for (var i = 0; i < v.choices.length; i++) {
        h.push('<label class="qf-chip"><input type="radio" name="' + id('service') + '" value="' + esc(v.choices[i][0]) + '">' +
          '<span>' + esc(v.choices[i][1]) + '</span></label>');
      }
      h.push('</div>' + err('serviceType', 'Please choose one.') + '</fieldset>');
    }
    var extras = v.extras || [];
    for (var j = 0; j < extras.length; j++) {
      h.push(select('x-' + extras[j].name, extras[j].label, 'Choose one', extras[j].options, false, true));
    }

    h.push('<div class="qf-full"><label class="qf-label" for="' + id('message') + '">Details &amp; Questions' +
      '<span class="qf-opt">(optional)</span></label>' +
      '<textarea id="' + id('message') + '" name="message" placeholder="' + esc(v.placeholder) + '"></textarea></div>');

    h.push('<div class="qf-hp" aria-hidden="true"><label for="' + id('website') + '">Website</label>' +
      '<input type="text" id="' + id('website') + '" name="website" tabindex="-1" autocomplete="off"></div>');
    h.push('</div>');

    // SMS / email consent (A2P 10DLC + TCPA). Wording matches the live contact form.
    h.push('<div class="qf-consent">' +
      '<div class="qf-check" id="' + id('consentRow') + '">' +
      '<input type="checkbox" id="' + id('consentTxn') + '" name="sms_consent_transactional" value="true">' +
      '<label for="' + id('consentTxn') + '">By checking this box, I consent to receive non-marketing text messages from <strong>Precision Vehicle Wraps</strong> about quotes, appointment confirmations, project updates, and service reminders. Message frequency varies. Message &amp; data rates may apply. Text HELP for assistance, reply STOP to opt out. <span class="qf-req">*</span></label>' +
      '</div>' + err('consentTxn', 'Please agree to receive transactional messages so we can confirm your appointment.') +
      '<div class="qf-check">' +
      '<input type="checkbox" id="' + id('consentMkt') + '" name="sms_consent_marketing" value="true">' +
      '<label for="' + id('consentMkt') + '">By checking this box, I consent to receive marketing and promotional messages including special offers, discounts, and new product updates from <strong>Precision Vehicle Wraps</strong> at the phone number provided. Frequency may vary. Message &amp; data rates may apply. Text HELP for assistance, reply STOP to opt out.</label>' +
      '</div></div>');

    h.push('<button type="submit" class="qf-submit"><span class="qf-spin" aria-hidden="true"></span>' +
      '<span class="qf-btn-text">' + esc(v.button) + ' &rarr;</span></button>');
    h.push('<p class="qf-fail" role="alert">Something went wrong sending your request. Please try again, or call us at ' +
      '<a href="tel:' + PHONE + '">' + PHONE + '</a>.</p>');
    h.push('<p class="qf-foot">Prefer to talk? Call <a href="tel:' + PHONE + '">' + PHONE + '</a></p>');
    h.push('</form>');

    h.push('<div class="qf-done" role="status" aria-live="polite"><div class="qf-tick" aria-hidden="true">&#10003;</div>' +
      '<h3>We\'ve Got Your Request!</h3><p>Alex will be in touch within 1 business day<br>to discuss your project.</p></div>');
    h.push('</div>');
    root.innerHTML = h.join('');
  }

  function readCookie(name) {
    var parts = document.cookie ? document.cookie.split('; ') : [];
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (parts[i].slice(0, eq) === name) {
        try { return decodeURIComponent(parts[i].slice(eq + 1)); } catch (e) { return parts[i].slice(eq + 1); }
      }
    }
    return '';
  }

  // Where the lead came from. URL parameters first, then the HandL UTM
  // Grabber cookies the site already sets. GHL ignores keys the workflow
  // does not map, so these are safe to send before anyone maps them.
  function attribution() {
    var q = {};
    try { new URLSearchParams(window.location.search).forEach(function (val, k) { q[k] = val; }); } catch (e) {}
    var a = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid'].forEach(function (k) {
      a[k] = q[k] || readCookie(k) || '';
    });
    if (!a.gclid) {
      var gcl = readCookie('_gcl_aw');
      if (gcl) a.gclid = gcl.split('.').slice(2).join('.');
    }
    a.landing_page = readCookie('handl_landing_page');
    a.original_referrer = readCookie('handl_original_ref');
    a.referrer = readCookie('handl_ref') || document.referrer || '';
    var summary = [];
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(function (k) {
      if (a[k]) summary.push(k.replace('utm_', '') + '=' + a[k]);
    });
    if (a.gclid) summary.push('gclid');
    if (a.fbclid) summary.push('fbclid');
    if (a.landing_page) summary.push('landing=' + a.landing_page);
    if (a.original_referrer) summary.push('ref=' + a.original_referrer);
    a.utm_summary = summary.join(' | ').slice(0, 500);
    return a;
  }

  function bind(root, key, v, n) {
    var form = root.querySelector('.qf-form');
    var card = root.querySelector('.qf-card');
    var btn = root.querySelector('.qf-submit');
    var fail = root.querySelector('.qf-fail');
    var loadedAt = Date.now();
    var sending = false;
    var el = function (f) { return document.getElementById('pvwqf' + n + '-' + f); };
    var val = function (f) { var e = el(f); return e ? e.value.trim() : ''; };

    function mark(f, bad, target) {
      var t = target || el(f);
      var e = el(f + '-err');
      if (t) {
        t.classList[bad ? 'add' : 'remove']('is-invalid');
        if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') {
          if (bad) { t.setAttribute('aria-invalid', 'true'); if (e) t.setAttribute('aria-describedby', e.id); }
          else { t.removeAttribute('aria-invalid'); }
        }
      }
      if (e) e.classList[bad ? 'add' : 'remove']('is-shown');
      return bad;
    }

    function serviceValue() {
      if (v.service) return v.service;
      var sel = el('serviceType');
      if (sel && sel.tagName === 'SELECT') return sel.value;
      var picked = root.querySelector('input[name="pvwqf' + n + '-service"]:checked');
      return picked ? picked.value : '';
    }

    function phoneOk(p) {
      var d = (p || '').replace(/\D/g, '');
      if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
      return d.length >= 10 && d.length <= 15;
    }

    function validate() {
      var first = null;
      var check = function (f, bad, target) {
        if (mark(f, bad, target) && !first) first = target || el(f);
      };
      check('firstName', !val('firstName'));
      check('lastName', !val('lastName'));
      check('email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email')));
      check('phone', !phoneOk(val('phone')));
      if (!v.vehicleOptional) {
        check('vehicleYear', !val('vehicleYear'));
        check('vehicleMake', !val('vehicleMake'));
        check('vehicleModel', !val('vehicleModel'));
      }
      if (!v.service) {
        var sel = el('serviceType');
        var bad = !serviceValue();
        if (sel && sel.tagName === 'SELECT') check('serviceType', bad);
        else {
          check('serviceType', bad, sel);
          if (bad && first === sel) first = root.querySelector('input[name="pvwqf' + n + '-service"]');
        }
      }
      var txn = el('consentTxn');
      mark('consentTxn', !txn.checked, el('consentRow'));
      if (!txn.checked && !first) first = txn;
      return first;
    }

    function message() {
      var lines = [];
      (v.extras || []).forEach(function (x) {
        var picked = val('x-' + x.name);
        if (picked) lines.push(x.note + ': ' + picked);
      });
      if (v.company && val('company')) lines.push('Company: ' + val('company'));
      if (v.vehicleCount && val('vehicleCount')) lines.push('Number of vehicles: ' + val('vehicleCount'));
      var typed = val('message');
      if (!lines.length) return typed;
      return lines.join('\n') + (typed ? '\n\n' + typed : '');
    }

    function done() {
      card.classList.add('is-sent');
      var r = card.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    function goThankYou(serviceType) {
      var setting = (root.getAttribute('data-thanks') || 'auto').trim();
      if (setting === 'off') return;
      var target = setting !== 'auto' ? setting : (THANK_YOU[serviceType] || THANK_YOU_DEFAULT);
      var nav = window.PVWQF_NAVIGATE || function (url) { window.location.href = url; };
      var go = function (url) { setTimeout(function () { nav(url); }, 900); };
      if (target === THANK_YOU_DEFAULT) { go(target); return; }
      // A missing page redirects to the homepage here, which counts nothing,
      // so check the page exists first and fall back to /thank-you/.
      var settled = false;
      var settle = function (url) { if (!settled) { settled = true; go(url); } };
      setTimeout(function () { settle(THANK_YOU_DEFAULT); }, 2500);
      fetch(target, { method: 'HEAD', credentials: 'same-origin', cache: 'no-store' })
        .then(function (res) { settle(res.ok && !res.redirected ? target : THANK_YOU_DEFAULT); })
        .catch(function () { settle(THANK_YOU_DEFAULT); });
    }

    form.addEventListener('input', function (e) {
      var t = e.target;
      if (t.classList && t.classList.contains('is-invalid')) mark(t.id.replace('pvwqf' + n + '-', ''), false);
    });
    form.addEventListener('change', function (e) {
      var t = e.target;
      if (t.type === 'radio') mark('serviceType', false, el('serviceType'));
      if (t.type === 'checkbox' && t.checked && t.name === 'sms_consent_transactional') mark('consentTxn', false, el('consentRow'));
      if (t.tagName === 'SELECT' && t.value) mark(t.id.replace('pvwqf' + n + '-', ''), false);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;
      fail.classList.remove('is-shown');

      // Bots: fake success, send nothing, count nothing.
      if (val('website') || Date.now() - loadedAt < MIN_SUBMIT_MS) { done(); return; }

      var firstBad = validate();
      if (firstBad) { try { firstBad.focus({ preventScroll: false }); } catch (x) { firstBad.focus(); } return; }

      sending = true;
      btn.disabled = true;
      btn.classList.add('is-loading');

      var serviceType = serviceValue();
      var a = attribution();
      var payload = {
        firstName:                 val('firstName'),
        lastName:                  val('lastName'),
        email:                     val('email'),
        phone:                     val('phone'),
        vehicle_year:              val('vehicleYear'),
        vehicle_make:              val('vehicleMake'),
        vehicle_model:             val('vehicleModel'),
        service_type:              serviceType,
        message:                   message(),
        sms_consent_transactional: el('consentTxn').checked,
        sms_consent_marketing:     el('consentMkt').checked,
        consent_timestamp:         new Date().toISOString(),
        consent_user_agent:        (navigator && navigator.userAgent) ? navigator.userAgent : '',
        source:                    SOURCE,
        page_url:                  window.location.href,
        // New keys. The GHL workflow ignores them until someone maps them.
        form_variant:              key,
        company_name:              v.company ? val('company') : '',
        vehicle_count:             v.vehicleCount ? val('vehicleCount') : '',
        utm_source:                a.utm_source,
        utm_medium:                a.utm_medium,
        utm_campaign:              a.utm_campaign,
        utm_term:                  a.utm_term,
        utm_content:               a.utm_content,
        gclid:                     a.gclid,
        fbclid:                    a.fbclid,
        landing_page:              a.landing_page,
        original_referrer:         a.original_referrer,
        referrer:                  a.referrer,
        utm_summary:               a.utm_summary
      };
      (v.extras || []).forEach(function (x) { payload[x.name] = val('x-' + x.name); });

      fetch(GHL_WEBHOOK_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      })
      .then(function () {
        // GHL's inbound webhook replies 422 even when it ingests the payload,
        // so any HTTP response counts as success. Never throw on !res.ok here.
        // (Fixed in 42e176d, regressed in 70af4b4, re-fixed in 1f0263a.)
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: 'generate_lead', form_variant: key, service_type: serviceType });
        done();
        goThankYou(serviceType);
      })
      .catch(function (err) {
        if (window.console) console.error('PVW quote form: send failed', err);
        sending = false;
        btn.disabled = false;
        btn.classList.remove('is-loading');
        fail.classList.add('is-shown');
      });
    });
  }

  function init() {
    var roots = document.querySelectorAll('.pvw-qf');
    for (var i = 0; i < roots.length; i++) {
      var root = roots[i];
      if (root.getAttribute('data-ready')) continue;
      root.setAttribute('data-ready', '1');
      var key = pickVariant(root);
      var n = ++counter;
      render(root, key, VARIANTS[key], n);
      bind(root, key, VARIANTS[key], n);
      root.setAttribute('data-variant', key);
      var inPopup = root.closest('[data-elementor-type="popup"], .elementor-popup-modal');
      if (!root.id && !inPopup && !document.getElementById('quote')) root.id = 'quote';
    }
  }

  window.PVWQuoteForm = { init: init, version: '2026-09-25' };
  init();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  if (window.jQuery) window.jQuery(document).on('elementor/popup/show', init);
})();
</script>
